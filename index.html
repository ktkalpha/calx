<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calx</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region><span class="logo">calx</span><span class="cursor">▍</span></div>
        <div class="hints" data-tauri-drag-region>
          <span><kbd>⌘↵</kbd> run block</span>
          <span><kbd>⇧↵</kbd> run line</span>
          <span><kbd>⌘⇧↵</kbd> run all</span>
          <span><kbd>⌘.</kbd> stop</span>
          <span><kbd>⌘K</kbd> clear</span>
        </div>
        <div id="kernel-status" class="status booting" data-tauri-drag-region><i></i><span>booting</span></div>
      </header>
      <main id="workspace">
        <section id="editor-pane" class="pane">
          <div class="pane-head"><span class="pane-title">scratch.calx</span><span id="cursor-pos" class="dim"></span></div>
          <div id="editor"></div>
        </section>
        <div class="splitter vertical" data-split="col"></div>
        <section id="side">
          <section id="graph-pane" class="pane">
            <div class="pane-head">
              <span class="pane-title">graph</span>
              <span id="graph-title" class="dim"></span>
              <span class="spacer"></span>
              <span id="graph-coords" class="dim"></span>
              <button id="graph-zoom-in" title="zoom in">+</button>
              <button id="graph-zoom-out" title="zoom out">−</button>
              <button id="graph-reset" title="reset view (double-click)">⟲</button>
            </div>
            <div id="graph"><canvas></canvas><div class="graph-empty">~ sin(x) ; x^2 + y^2 = 9</div></div>
          </section>
          <div class="splitter horizontal" data-split="row"></div>
          <section id="term-pane" class="pane">
            <div class="pane-head"><span class="pane-title">terminal</span><span class="spacer"></span><button id="term-clear" title="clear (⌘K)">clear</button></div>
            <div id="terminal">
              <div id="log"></div>
              <label id="prompt"><span class="ps1">calx ❯</span><input id="prompt-input" spellcheck="false" autocomplete="off" autocapitalize="off" /></label>
            </div>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
